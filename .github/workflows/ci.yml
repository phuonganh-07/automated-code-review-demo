name: Java CI with Automated Review

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Checkstyle
        run: mvn checkstyle:checkstyle

      - name: Checkstyle Inline Feedback
        uses: dbelyaev/action-checkstyle@master
        if: failure()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: google_checks.xml
          level: error

      - name: Run Tests
        run: mvn test